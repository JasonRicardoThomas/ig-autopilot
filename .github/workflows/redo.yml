name: Redo unapproved posts
on: workflow_dispatch
concurrency: {group: autopilot-data, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  redo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: pip install -e . 2>/dev/null || echo "PYTHONPATH=src" >> $GITHUB_ENV
      - run: pip install -r requirements-render.txt && playwright install --with-deps chromium && sudo apt-get install -y ffmpeg
      - run: PYTHONPATH=src python -m autopilot redo
      - run: ./scripts/commit.sh "redo unapproved posts"
