name: Refresh Meta token
on:
  schedule: [{cron: "0 6 1 * *"}]
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: pip install -e . 2>/dev/null || echo "PYTHONPATH=src" >> $GITHUB_ENV
      - run: PYTHONPATH=src python -m autopilot refresh-token
        env:
          GH_REPO: ${{ github.repository }}
