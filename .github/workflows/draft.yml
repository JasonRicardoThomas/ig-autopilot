name: Draft new posts
on:
  schedule: [{cron: "0 12 * * *"}]
  workflow_dispatch:
concurrency: {group: autopilot-data, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: pip install -e . 2>/dev/null || echo "PYTHONPATH=src" >> $GITHUB_ENV
      - run: pip install -r requirements-render.txt && playwright install --with-deps chromium && sudo apt-get install -y ffmpeg
      - run: PYTHONPATH=src python -m autopilot draft --days 2
      - run: ./scripts/commit.sh "draft new posts"
