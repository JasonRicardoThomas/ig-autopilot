<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Review</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>Review queue</h1><div id="status"></div></header>
<section id="login" hidden><p>Paste your GitHub token once. It stays on this phone only.</p>
<input id="token" type="password" placeholder="Fine-grained token" autocomplete="off"><input id="repo" placeholder="owner/repo" value="JasonRicardoThomas/ig-autopilot"><button id="save">Save</button></section>
<nav id="tabs"><button data-f="pending" class="on">To review</button><button data-f="approved">Approved</button><button data-f="published">Posted</button><button data-f="rejected">Rejected</button></nav>
<main id="list"></main><script src="app.js"></script></body></html>
